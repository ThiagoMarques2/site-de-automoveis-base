<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style_contato.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo">AutoPrime Motors</div>
        <nav>
            <ul>
                <li><a href="site.html">Início</a></li>
                <li><a href="#carros">Carros</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Formulário de Contato -->
    <section class="corpo-formulario">
        <div class="div-container">
        <h2>Entre em Contato</h2>
        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>
        
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="text" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>
        
        <div class="form-group">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="4" placeholder="Informe o motivo do seu contato" required></textarea>
            </div>
                <button type="submit">Enviar</button>
        </div>
    </section>


    <!-- Rodapé -->
    <footer>
        <p>© 2025 AutoPrime Motors - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
